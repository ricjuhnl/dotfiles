# Don't print a new line at the start of the prompt
add_newline = false
# Pipes ╰─ ╭─
# Powerline symbols                                     
# Wedges 🭧🭒 🭣🭧🭓
# Random noise 🬖🬥🬔🬗

# format = """
# $cmd_duration$username$hostname $directory $git_branch
# $character
# """
format = """
$cmd_duration$directory $git_branch $git_metrics
$character
"""

right_format = """$git_status • $git_commit"""

command_timeout = 1000

# Replace the "❯" symbol in the prompt with "➜"
[character]                            # The name of the module we are configuring is "character"
success_symbol = "[](bold fg:green) "
error_symbol = "[](bold fg:red) "

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[git_metrics]
disabled = false

[git_branch]
style = "bg: cyan"
symbol = "󰘬"
format = "• [](fg:cyan)[$symbol $branch(:$remote_branch)](fg:black bg:cyan)[ ](fg:cyan)"

[git_commit]
tag_symbol = "  "
tag_disabled = false
only_detached = false
format = "[](fg:blue)[($hash$tag)](bold bg:blue fg:black)[](fg:blue)"

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '

[git_status]
style = "bold yellow"
format = "[](fg:yellow)$all_status$ahead_behind[](fg:yellow)"
up_to_date = "[•](fg:black bg:yellow)"
conflicted	= "[=](fg:black bg:yellow)"
ahead	= "[⇡](fg:black bg:yellow)"
behind	= "[⇣](fg:black bg:yellow)"
diverged	= "[⇕](fg:black bg:yellow)"
untracked	= "[?](fg:black bg:yellow)"
modified	= "[!](fg:black bg:yellow)"
staged	= "[+](fg:black bg:yellow)"
renamed	= "[»](fg:black bg:yellow)"
deleted	= "[✘](fg:black bg:yellow)"
stashed	= ""

[hostname]
ssh_only = false
format =  "[•$hostname](bg:cyan bold fg:black)[](bold fg:cyan )"
trim_at = ".companyname.com"
disabled = false

[line_break]
disabled = false

[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "bold dimmed green"

[time]
disabled = true
format = '🕙[\[ $time \]]($style) '
time_format = "%T"

[username]
style_user = "bold bg:cyan fg:black"
style_root = "red bold"
format = "[](bold fg:cyan)[$user]($style)"
disabled = false
show_always = true

[directory]
home_symbol = "  "
read_only = "  "
style = "bg:green fg:black"
truncation_length = 6
truncation_symbol = "••/"
format = '[](fg:green)[$path ]($style)[](fg:green)'


[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "

[cmd_duration]
min_time = 1_000
format = '[](fg:yellow)[ $duration](bold bg:yellow fg:black)[](fg:yellow) •• '
