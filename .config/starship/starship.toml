palette = "noctalia"
# Starship Configuration
# A minimal, clean, and non-distracting prompt

# Inserts a blank line between shell prompts
add_newline = true

# Configure the main prompt format (left side) - minimal and clean
format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$fill\
$kubernetes\
$docker_context\
$line_break\
$character"""


[fill]
symbol = ' '

[username]
style_user = "orange"
style_root = "red"
format = "[$user]($style) "
disabled = false

[hostname]
ssh_only = true
style = 'fg:blue'
format = '[@$hostname]($style) '

# Prompt character
[character]
success_symbol = '[](bold green)'
error_symbol = '[](bold red)'

# Directory
[directory]
style = "fg:orange"
read_only_style = "fg:red"
read_only = " 󰌾"
truncation_length = 3
truncation_symbol = '../'
truncate_to_repo = true
format = "[ $path]($style)[$read_only]($read_only_style) "

# Git
[git_branch]
symbol = " "
style = "fg:green"

[git_status]
style = "fg:yellow"
format = '([$all_status$ahead_behind]($style) )'

[git_commit]
tag_symbol = ' '

# Tools and Frameworks
[docker_context]
style = 'blue'
symbol = '🐳 '
only_with_files = true
detect_files = ['docker-compose.yml', 'docker-compose.yaml', 'Dockerfile']
format = '[$symbol $context\]($style)'

[kubernetes]
style = 'blue'
symbol = "󱃾"
format = '[$symbol $context\($namespace\)]($style)'
disabled = false
contexts = [
  { context_pattern = "dev.local.cluster.k8s", symbol = "💔 " },
]

# Version Control
[fossil_branch]
symbol = " "

[hg_branch]
symbol = " "

[os.symbols]
Arch = " "
CachyOS = " "

