# Starship Configuration
# A minimal, clean, and non-distracting prompt

# Inserts a blank line between shell prompts
add_newline = true

# Configure the main prompt format (left side) - minimal and clean
format = """
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$fill\
$python\
$nodejs\
$rust\
$golang\
$docker_context\
$line_break\
$character"""

palette = "everforest"

# Configure the right side of the prompt
right_format = """$kubernetes"""

[fill]
symbol = ' '

[username]
style_user = "orange"
style_root = "red"
format = "[$user]($style) "
disabled = false

[hostname]
ssh_only = true
style = 'fg:blue'
format = '[@$hostname]($style) '

# Prompt character
[character]
success_symbol = '[](bold green)'
error_symbol = '[](bold red)'

# Directory
[directory]
style = "fg:orange"
read_only_style = "fg:red"
read_only = " 󰌾"
truncation_length = 3
truncation_symbol = '../'
truncate_to_repo = true
format = "[ $path]($style)[$read_only]($read_only_style) "

# Git
[git_branch]
symbol = " "
style = "fg:green"

[git_status]
style = "fg:yellow"
format = '([$all_status$ahead_behind]($style) )'

[git_commit]
tag_symbol = ' '

# Tools and Frameworks
[docker_context]
style = 'blue'
symbol = '🐳 '
only_with_files = true
detect_files = ['docker-compose.yml', 'docker-compose.yaml', 'Dockerfile']
format = '[$symbol $context\]($stle)'


[kubernetes]
style = 'bg_blue'
symbol = "󱃾"
format = '[$symbol $context\($namespace\)]($style)'
disabled = false
contexts = [
  { context_pattern = "dev.local.cluster.k8s", style = "dimmed red", symbol = "💔 " },
]

[memory_usage]
symbol = "󰍛 "

# Version Control
[fossil_branch]
symbol = " "

[hg_branch]
symbol = " "

[os.symbols]
CachyOS = " "

[palettes.everforest]
bg_dim = "#232a2e"
bg0 = "#2d353b"
bg1 = "#343f44"
bg2 = "#3d484d"
bg3 = "#475258"
bg4 = "#4f585e"
bg5 = "#56635f"
bg_visual = "#543a48"
bg_red = "#514045"
bg_green = "#425047"
bg_blue = "#3a515d"
bg_yellow = "#4d4c43"

fg = "#d3c6aa"
red = "#e67e80"

orange = "#e69875"
yellow = "#dbbc7f"
green = "#a7c080"
aqua = "#83c092"
blue = "#7fbbb3"
purple = "#d699b6"
grey0 = "#7a8478"
grey1 = "#859289"
grey2 = "#9da9a0"
statusline1 = "#a7c080"
statusline2 = "#d3c6aa"
statusline3 = "#e67e80"