# morgan-atajos: los atajos de ventanas de morgan (foco y movimiento de columnas, workspaces,
# monitores, layout scrolling, apps que ciclan). Lo escribe `morgan setup` una vez y no lo
# reescribe: se edita a mano. El cargador lo incluye antes que user.toml, así que lo que está
# en user.toml pisa estas teclas. Las apps que ciclan usan `umbriel-ciclar` (pide `jq`).
#
# Cleaned up to remove uninstalled apps (vesktop, steam, brave-origin) and binds
# already owned by user.toml.

[keybinds]
# Apps & media
"Mod+Shift+E" = { action = "spawn umbriel-ciclar org.gnome.Nautilus nautilus", repeat = false }
"Mod+O" = { action = "spawn umbriel-ciclar md.obsidian.Obsidian obsidian", repeat = false }
"Mod+M" = { action = "spawn kitty --class btop btop", repeat = false }
"Mod+Shift+M" = { action = "spawn morganctl volume mute --mic", repeat = false }

# Move window to monitor (referenced by user.toml)
"Mod+Ctrl+Shift+Left" = "window-move-to-output-left"
"Mod+Ctrl+Shift+H" = "window-move-to-output-left"
"Mod+Ctrl+Shift+Right" = "window-move-to-output-right"
"Mod+Ctrl+Shift+L" = "window-move-to-output-right"
"Mod+Ctrl+Shift+Up" = "window-move-to-output-up"
"Mod+Ctrl+Shift+K" = "window-move-to-output-up"
"Mod+Ctrl+Shift+Down" = "window-move-to-output-down"
"Mod+Ctrl+Shift+J" = "window-move-to-output-down"

# Relative & numbered workspaces (single-window moves; user.toml binds Mod+Ctrl+1..9 for columns)
"Mod+Shift+I" = "window-move-to-workspace-previous"
"Mod+Shift+U" = "window-move-to-workspace-next"
"Mod+Page_Up" = "workspace-previous"
"Mod+Page_Down" = "workspace-next"
"Mod+0" = "workspace-switch 10"
"Mod+Ctrl+0" = "window-move-to-workspace 10"
"Mod+Shift+0" = "window-move-to-workspace 10"
"Mod+Shift+1" = "window-move-to-workspace 1"
"Mod+Shift+2" = "window-move-to-workspace 2"
"Mod+Shift+3" = "window-move-to-workspace 3"
"Mod+Shift+4" = "window-move-to-workspace 4"
"Mod+Shift+5" = "window-move-to-workspace 5"
"Mod+Shift+6" = "window-move-to-workspace 6"
"Mod+Shift+7" = "window-move-to-workspace 7"
"Mod+Shift+8" = "window-move-to-workspace 8"
"Mod+Shift+9" = "window-move-to-workspace 9"

# Layout toggle
"Mod+D" = { action = "workspace-set-layout toggle scrolling dwindle", repeat = false }
