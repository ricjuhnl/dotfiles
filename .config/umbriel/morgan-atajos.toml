# morgan-atajos: los atajos de ventanas de morgan (foco y movimiento de columnas, workspaces,
# monitores, layout scrolling, apps que ciclan). Lo escribe `morgan setup` una vez y no lo
# reescribe: se edita a mano. El cargador lo incluye antes que user.toml, así que lo que está
# en user.toml pisa estas teclas. Las apps que ciclan usan `umbriel-ciclar` (pide `jq`).

[keybinds]
"Mod+Return" = { action = "spawn umbriel-ciclar kitty kitty", repeat = false }
"Mod+B" = { action = "spawn umbriel-ciclar brave-origin brave-origin", repeat = false }
"Mod+E" = { action = "spawn umbriel-ciclar yazi kitty --class yazi yazi", repeat = false }
"Mod+Shift+E" = { action = "spawn umbriel-ciclar org.gnome.Nautilus nautilus", repeat = false }
"Mod+Z" = { action = "spawn umbriel-ciclar vesktop vesktop", repeat = false }
"Mod+S" = { action = "spawn umbriel-ciclar steam steam", repeat = false }
"Mod+O" = { action = "spawn umbriel-ciclar md.obsidian.Obsidian obsidian", repeat = false }
"Mod+Shift+Return" = { action = "spawn kitty", repeat = false }
"Mod+Shift+B" = { action = "spawn brave-origin", repeat = false }
"Mod+M" = { action = "spawn kitty --class btop btop", repeat = false }
"Mod+Shift+M" = { action = "spawn morganctl volume mute --mic", repeat = false }
"Mod+Q" = { action = "window-close", repeat = false }
"Mod+Left" = "window-focus-left"
"Mod+Ctrl+Left" = "output-focus-left"
"Mod+Ctrl+Shift+Left" = "window-move-to-output-left"
"Mod+H" = "window-focus-left"
"Mod+Ctrl+H" = "output-focus-left"
"Mod+Ctrl+Shift+H" = "window-move-to-output-left"
"Mod+Right" = "window-focus-right"
"Mod+Ctrl+Right" = "output-focus-right"
"Mod+Ctrl+Shift+Right" = "window-move-to-output-right"
"Mod+L" = "window-focus-right"
"Mod+Ctrl+L" = "output-focus-right"
"Mod+Ctrl+Shift+L" = "window-move-to-output-right"
"Mod+Up" = "window-focus-up"
"Mod+Ctrl+Up" = "output-focus-up"
"Mod+Ctrl+Shift+Up" = "window-move-to-output-up"
"Mod+K" = "window-focus-up"
"Mod+Ctrl+K" = "output-focus-up"
"Mod+Ctrl+Shift+K" = "window-move-to-output-up"
"Mod+Down" = "window-focus-down"
"Mod+Ctrl+Down" = "output-focus-down"
"Mod+Ctrl+Shift+Down" = "window-move-to-output-down"
"Mod+J" = "window-focus-down"
"Mod+Ctrl+J" = "output-focus-down"
"Mod+Ctrl+Shift+J" = "window-move-to-output-down"
"Mod+Shift+Left" = "column-move-left"
"Mod+Shift+H" = "column-move-left"
"Mod+Shift+Right" = "column-move-right"
"Mod+Shift+L" = "column-move-right"
"Mod+Shift+Up" = "window-move-to-workspace-previous"
"Mod+Shift+K" = "window-move-to-workspace-previous"
"Mod+Shift+I" = "window-move-to-workspace-previous"
"Mod+Shift+Down" = "window-move-to-workspace-next"
"Mod+Shift+J" = "window-move-to-workspace-next"
"Mod+Shift+U" = "window-move-to-workspace-next"
# Mod+I / Mod+U left unbound on purpose (niri habit: the HJKL cluster is focus-only);
# relative workspace switching stays on Page_Up / Page_Down, the wheel, and Mod+1..9.
"Mod+Page_Up" = "workspace-previous"
"Mod+Page_Down" = "workspace-next"
"Mod+WheelUp" = { action = "workspace-previous", cooldown_ms = 300 }
"Mod+WheelDown" = { action = "workspace-next", cooldown_ms = 300 }
"Mod+Shift+WheelUp" = "window-focus-left"
"Mod+Shift+WheelDown" = "window-focus-right"
"Mod+0" = "workspace-switch 10"
"Mod+Ctrl+0" = "window-move-to-workspace 10"
"Mod+Shift+0" = "window-move-to-workspace 10"
"Mod+1" = "workspace-switch 1"
"Mod+Ctrl+1" = "window-move-to-workspace 1"
"Mod+Shift+1" = "window-move-to-workspace 1"
"Mod+2" = "workspace-switch 2"
"Mod+Ctrl+2" = "window-move-to-workspace 2"
"Mod+Shift+2" = "window-move-to-workspace 2"
"Mod+3" = "workspace-switch 3"
"Mod+Ctrl+3" = "window-move-to-workspace 3"
"Mod+Shift+3" = "window-move-to-workspace 3"
"Mod+4" = "workspace-switch 4"
"Mod+Ctrl+4" = "window-move-to-workspace 4"
"Mod+Shift+4" = "window-move-to-workspace 4"
"Mod+5" = "workspace-switch 5"
"Mod+Ctrl+5" = "window-move-to-workspace 5"
"Mod+Shift+5" = "window-move-to-workspace 5"
"Mod+6" = "workspace-switch 6"
"Mod+Ctrl+6" = "window-move-to-workspace 6"
"Mod+Shift+6" = "window-move-to-workspace 6"
"Mod+7" = "workspace-switch 7"
"Mod+Ctrl+7" = "window-move-to-workspace 7"
"Mod+Shift+7" = "window-move-to-workspace 7"
"Mod+8" = "workspace-switch 8"
"Mod+Ctrl+8" = "window-move-to-workspace 8"
"Mod+Shift+8" = "window-move-to-workspace 8"
"Mod+9" = "workspace-switch 9"
"Mod+Ctrl+9" = "window-move-to-workspace 9"
"Mod+Shift+9" = "window-move-to-workspace 9"
"Mod+F" = { action = "window-toggle-maximize", repeat = false }
"Mod+Shift+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+T" = { action = "window-toggle-floating", repeat = false }
"Mod+W" = { action = "column-toggle-tabbed", repeat = false }
"Mod+C" = { action = "column-center", repeat = false }
"Mod+Minus" = "window-modify-primary-extent -0.1"
"Mod+plus" = "window-modify-primary-extent +0.1"
"Mod+Shift+Minus" = "window-modify-secondary-extent -0.05"
"Mod+Shift+plus" = "window-modify-secondary-extent +0.05"
"Mod+D" = { action = "workspace-set-layout toggle scrolling dwindle", repeat = false }
"Ctrl+Alt+Delete" = { action = "session-quit skip-confirmation", repeat = false }
"Mod+Shift+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }
