# morgan: sus atajos, las reglas de sus capas, el tema, el borde y la sombra, y lo
# cambiado desde su menú. Lo escribe morgan con cada cambio de su config
# (morgan/config.toml, umbriel.toml, monitors.toml): no editar a mano. Va último en
# ~/.config/umbriel/config.toml, así que gana sobre user.toml.

[animation]
enabled = true

[animation.beziers]
morgan_decel = [0.05, 0.7, 0.1, 1.0]
morgan_expo = [0.16, 1.0, 0.3, 1.0]
morgan_rebote = [0.34, 1.3, 0.64, 1.0]

[animation.layers]
curve = "morgan_decel"
duration_ms = 200
enabled = true

[animation.windows_in]
curve = "morgan_decel"
duration_ms = 200
enabled = true
style = "popin"

[animation.windows_move]
curve = "morgan_decel"
duration_ms = 200
enabled = true

[animation.windows_out]
curve = "morgan_decel"
duration_ms = 150
enabled = true
style = "fade"

[animation.workspaces]
curve = "morgan_expo"
duration_ms = 250
enabled = true
style = "slide"

[appearance.shadow]
enabled = false

[effects]
border = "morgan-borde"

[effects.preset.morgan-borde]
animated = false
kind = "border"
padding = 6
palette = true
shader = "morgan-borde.glsl"

[hot_corners.top_left]
action = "overview-toggle"
enabled = true

[include.optional]
files = ["/home/rjuhasz/.local/state/morgan/tema/umbriel.toml"]

[input.cursor]
size = 24
theme = "Nordzy-cursors-white"

[output.DP-3]
mode = "5120x1440@75.00"

[keybinds]
# Menús y lanzadores (morgan)
"Super+space" = { action = "spawn morganctl launcher toggle", repeat = false }
"Super+Alt+U" = { action = "spawn morganctl launcher toggle symbols", repeat = false }
"Super+V" = { action = "spawn morganctl launcher toggle clipboard", repeat = false }
"Super+Alt+C" = { action = "spawn morganctl calculator toggle", repeat = false }
"Super+comma" = { action = "spawn morganctl menu toggle", repeat = false }
"Super+Y" = { action = "spawn morganctl wallpapers toggle", repeat = false }
"Super+Shift+Y" = { action = "spawn morganctl menu toggle wallpapers", repeat = false }
"Super+N" = { action = "spawn morganctl center toggle", repeat = false }
"Super+Shift+N" = { action = "spawn morganctl dnd toggle", repeat = false }
"Super+X" = { action = "spawn morganctl session", repeat = false }
# Bloqueo (morgan)
"Super+Alt+L" = { action = "spawn loginctl lock-session", repeat = false }
"Super+Alt+Shift+L" = { action = "spawn systemctl --user start morgan-lock.service", repeat = false, allow_when_locked = true }
# Ventanas: el overview de Umbriel
"Super+Tab" = { action = "overview-toggle", repeat = false }
# Multimedia y brillo (morgan)
"XF86AudioRaiseVolume" = { action = "spawn morganctl volume up", allow_when_locked = true }
"XF86AudioLowerVolume" = { action = "spawn morganctl volume down", allow_when_locked = true }
"XF86AudioMute" = { action = "spawn morganctl volume mute", allow_when_locked = true, repeat = false }
"XF86AudioMicMute" = { action = "spawn morganctl volume mute --mic", allow_when_locked = true, repeat = false }
"XF86AudioNext" = { action = "spawn morganctl player next", allow_when_locked = true, repeat = false }
"XF86AudioPrev" = { action = "spawn morganctl player previous", allow_when_locked = true, repeat = false }
"XF86AudioPlay" = { action = "spawn morganctl player play-pause", allow_when_locked = true, repeat = false }
"XF86AudioPause" = { action = "spawn morganctl player play-pause", allow_when_locked = true, repeat = false }
"XF86MonBrightnessUp" = { action = "spawn morganctl brightness up", allow_when_locked = true }
"XF86MonBrightnessDown" = { action = "spawn morganctl brightness down", allow_when_locked = true }
# Capturas de pantalla (grim y slurp)
"Print" = { action = "spawn mkdir -p '/home/rjuhasz/Pictures/Screenshots' && f='/home/rjuhasz/Pictures/Screenshots'/\"$(date +%Y-%m-%d-%H%M%S)_morgan.png\" && grim -g \"$(slurp)\" \"$f\" && wl-copy --type image/png < \"$f\" && morgan-captura \"$f\"", repeat = false }
"Ctrl+Print" = { action = "spawn mkdir -p '/home/rjuhasz/Pictures/Screenshots' && f='/home/rjuhasz/Pictures/Screenshots'/\"$(date +%Y-%m-%d-%H%M%S)_morgan.png\" && grim -o \"$(umbriel outputs --json | jq -r '.[] | select(.focused) | .name')\" \"$f\" && wl-copy --type image/png < \"$f\" && morgan-captura \"$f\"", repeat = false }
"Alt+Print" = { action = "spawn mkdir -p '/home/rjuhasz/Pictures/Screenshots' && f='/home/rjuhasz/Pictures/Screenshots'/\"$(date +%Y-%m-%d-%H%M%S)_morgan.png\" && grim -g \"$(umbriel focused-window --json | jq -r '\"\\(.x),\\(.y) \\(.w)x\\(.h)\"')\" \"$f\" && wl-copy --type image/png < \"$f\" && morgan-captura \"$f\"", repeat = false }
# Mientras el menú graba una tecla
"submap[morgan-record],Super+Ctrl+Alt+Shift+F24" = "submap reset"

# Las capas de morgan: desenfoque recortado a lo que se ve.
[[layer_rule]]
match.namespace = "^morgan-"
blur = true
blur_popups = true
blur_ignore_alpha = 0.5

[[layer_rule]]
match.namespace = "^morgan-(center|calendar|tray|calculator|notifications|osd|launcher|polkit|menu|wallpapers|windows|dock|dock-globo)$"
blur_optimized = false
